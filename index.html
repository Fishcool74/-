<!DOCTYPE html>
<html lang="zh-hant">
<head>
    <meta charset ="UTF-8">
    <title>踩地雷的啦！</title>
    <style>
        #map{
            display:grid;
            grid-template-columns:repeat(9,70px);
            gap:2px;
        }
        #map button{
            background-color:rgb(150,200,50);
            width:70px;
            height:70px;
            font-size:15px;
            color:black;
        }
        #map button:disabled{
            background-color: rgb(150,150,100);
        }
        #top{
            font-size: 50px;
            display: flex;
            gap: 10px;
        }
        #flag{
            width:200px;
            height:100px;
            font-size:35px;
        }
        #re{
            width:200px;
            height:100px;
            font-size:35px;
        }
        #bt{
            display: flex;
            gap: 10px;
        }
        .gameover{
            pointer-events: none;
        }
        #dif{
            display: flex;
            gap: 10px;
        }
        #ez{
            width:100px;
            height:50px;
            font-size:17px;
        }
        #mid{
            width:100px;
            height:50px;
            font-size:17px;
        }
        #hard{
            width:100px;
            height:50px;
            font-size:17px;
        }
    </style>
</head>
<body>
    <div id = "top">
        <p>踩地雷的啦！</p>
        <p id = "wl">選個難度吧!</p>
    </div>
    <div id="dif">
        <button id="ez">初級</button>
        <button id="mid">中級</button>
        <button id="hard">高級</button>
    </div>

    <div id="map"></div>

    <div id="bt">
        <button id = "flag">我要插旗子</button>
        <button id = "re" style="display: none;">再來一局</button>
    </div>
    <script>
        let de = 0;
        let flg = false;
        let go = false;
        let start = false;
        let mineka = 0;
        let mapbig = 0;
        let mapwidth = 0;
        let mapheight = 0;
        let goal = 0;

        const mine = [];
        const map = document.getElementById("map");
        const wl = document.getElementById("wl");
        const flag = document.getElementById("flag");
        const again = document.getElementById("re");
        const ez = document.getElementById("ez");
        const mid = document.getElementById("mid");
        const hard = document.getElementById("hard");
        
        map.style.display = "none";
        flag.style.display = "none";

        ez.addEventListener("click",function(){
            map.innerHTML = "";
            mineka = 10;
            mapbig = 81;
            mapwidth = 9;
            mapheight = 9;
            goal = mapbig-mineka;
            start = true;
            map.style.gridTemplateColumns = `repeat(${mapwidth}, 70px)`;
            wl.textContent = "找出地雷吧!";
            map.style.display = "grid";   
            flag.style.display = "block"; 
            while(mine.length < mineka){
                const po = Math.floor(Math.random()*mapbig);
                if(!mine.includes(po)){
                    mine.push(po);
                }
            }
            createmap();          
        });

        mid.addEventListener("click",function(){
            map.innerHTML = "";
            mineka = 40;
            mapbig = 256;
            mapwidth = 16;
            mapheight = 16;
            goal = mapbig-mineka;
            start = true;
            map.style.gridTemplateColumns = `repeat(${mapwidth}, 70px)`;
            wl.textContent = "找出地雷吧!";
            map.style.display = "grid";   
            flag.style.display = "block";  
            while(mine.length < mineka){
                const po = Math.floor(Math.random()*mapbig);
                if(!mine.includes(po)){
                    mine.push(po);
                }
            }    
            createmap();      
        });
        
        hard.addEventListener("click",function(){
            map.innerHTML = "";
            mineka = 99;
            mapbig = 480;
            mapwidth = 16;
            mapheight = 30;
            goal = mapbig-mineka;
            start = true;
            map.style.gridTemplateColumns = `repeat(${mapwidth}, 70px)`;
            wl.textContent = "找出地雷吧!";
            map.style.display = "grid";   
            flag.style.display = "block";  
            while(mine.length < mineka){
                const po = Math.floor(Math.random()*mapbig);
                if(!mine.includes(po)){
                    mine.push(po);
                }
            }  
            createmap();        
        });
       
        

        function detect(i){
            const lie = Math.floor(i/mapwidth);
            const han = i%mapwidth;
            let count = 0;

            for(let vl=-1 ; vl<2 ; vl++){
                for(let vh=-1 ; vh<2 ; vh++){
                    if(vl===0 && vh===0){
                        continue;
                    }

                    const l = lie+vl;
                    const h = han+vh;

                    if(l>=mapheight || l<0 || h>=mapwidth || h<0){
                        continue;
                    }

                    if(mine.includes(l*mapwidth+h)){
                        count++;
                    }
                }
            }
            return count;
        }

        function showzero(i){
            const op = map.querySelectorAll("button");
            const lie = Math.floor(i/mapwidth);
            const han = i%mapwidth;
            for(let vl=-1 ; vl<2 ; vl++){
                for(let vh=-1 ; vh<2 ; vh++){
                    if(vl===0 && vh===0){
                        continue;
                    }

                    const l = lie+vl;
                    const h = han+vh;

                    if(l>=mapheight || l<0 || h>=mapwidth || h<0){
                        continue;
                    }

                    const next = l*mapwidth + h;

                    if(op[next].disabled || mine.includes(next)){
                        continue;
                    }

                    const count = detect(next);

                    if(count === 0){
                        op[next].textContent="";
                        op[next].disabled=true;
                        de++;
                        showzero(next);
                    }
                    else{
                        op[next].textContent = count;
                        op[next].disabled = true;
                        de++;
                        if(de === goal){
                            wl.textContent = "全部找到了!!";
                            again.style.display = "block";
                            again.addEventListener("click", function(){location.reload()});
                        }
                    }
                }
            }
        }

        async function showboom(){
            const but = map.querySelectorAll("button");
            for(let i=0 ; i<mine.length ; i++){
                but[mine[i]].textContent="💣";
                but[mine[i]].disabled=true;
                await wait(250);
            }
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        flag.addEventListener("click",function(){
            if(flg === false){
                flg=!flg;
                flag.textContent="我要挖地雷";
            }
            else{
                flg=!flg;
                flag.textContent="我要插旗子";
            }
        });

        function createmap(){
            for(let i=0 ; i<mapbig ; i++){
                const bt = document.createElement("button");
                bt.textContent="X";
                bt.addEventListener("click",function(){
                    if(flg){
                        if(bt.classList.contains("al")){
                            bt.textContent="X";
                            bt.classList.remove("al");
                        }
                        else{
                            bt.textContent="🚩";
                            bt.classList.add("al");
                        }
                    }
                    else{
                        if(mine.includes(i) && !bt.classList.contains("al")){
                            bt.textContent="💣";
                            bt.disabled=true;
                            wl.textContent="你被炸彈的爆炸炸爆了";
                            map.classList.add("gameover");
                            again.style.display = "block";
                            again.addEventListener("click", function(){location.reload()});
                            showboom();
                        }    
                        else{
                            if(!bt.classList.contains("al")){
                                const count = detect(i);
                                if(count === 0){
                                    bt.textContent="";
                                    bt.disabled=true;
                                    de++;
                                    showzero(i)
                                }
                                else{
                                    bt.textContent=count;
                                    bt.disabled=true;
                                    de++;
                                    if(de === goal){
                                        wl.textContent = "全部找到了!!";
                                        again.style.display = "block";
                                        again.addEventListener("click", function(){location.reload()});
                                    }
                                }
                            }
                        }
                    }
                });
            map.appendChild(bt);
            }
        }
    </script>
</body>
</html>
